<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FraserFlow</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#990A2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FraserFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: app shell — resource panel (crews / staff / plant) on the left, resources-by-days roster board on the right, grouped into sections */
:root{
  --bg:#ECEDEF; --surface:#FFFFFF; --sunken:#F4F4F6; --line:#DBDDE2; --line-strong:#C3C7CF;
  --ink:#16181D; --muted:#5E636E; --faint:#8C919B;
  --accent:#990A2C; --accent-ink:#FFFFFF; --accent-soft:#F7E3E8;
  --weekend:#F1F1F4; --ok:#2F855A; --warn:#B7791F; --bad:#C53030; --night:#D93A2E; --night-ink:#FFFFFF; --night-edge:#8E1B13;
  --blk-l:91%; --blk-fg-l:25%; --blk-edge-l:47%; --hatch-l:86%;
  --shadow:0 1px 2px rgba(20,22,28,.06),0 8px 24px rgba(20,22,28,.06);
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --surface:#16181D; --sunken:#1B1E24; --line:#292C34; --line-strong:#373B45;
  --ink:#E8E9ED; --muted:#9CA0AA; --faint:#6F737D;
  --accent:#E46A84; --accent-ink:#1C0509; --accent-soft:#33141C;
  --weekend:#121418; --ok:#5CC08A; --warn:#E0A84A; --bad:#F07171; --night:#C93A2E; --night-ink:#FFFFFF; --night-edge:#FF8A7A;
  --blk-l:23%; --blk-fg-l:87%; --blk-edge-l:62%; --hatch-l:19%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#16181D; --sunken:#1B1E24; --line:#292C34; --line-strong:#373B45;
  --ink:#E8E9ED; --muted:#9CA0AA; --faint:#6F737D;
  --accent:#E46A84; --accent-ink:#1C0509; --accent-soft:#33141C;
  --weekend:#121418; --ok:#5CC08A; --warn:#E0A84A; --bad:#F07171; --night:#C93A2E; --night-ink:#FFFFFF; --night-edge:#FF8A7A;
  --blk-l:23%; --blk-fg-l:87%; --blk-edge-l:62%; --hatch-l:19%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#root{height:100%}
.font-display{font-family:var(--f-display)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.tnum{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand-tag{display:block}
/* thin Alex Fraser maroon strip across the top of the page */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:#990A2C;z-index:80;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-tag{filter:invert(1)}}
:root[data-theme="dark"] .brand-tag{filter:invert(1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
@media (max-width:639px){.shell{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px}}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line-strong);background:var(--sunken)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.06)}
.btn-ghost{border-color:transparent;background:transparent}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunken);border:1px solid var(--line)}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:0;background:transparent;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{width:100%;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.field-sm{height:26px;padding:0 6px;font-size:12px;border-radius:6px}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.blk{position:absolute;height:28px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:grab;transition:transform .1s,box-shadow .1s;user-select:none;touch-action:none}
.blk>*:not(.wkoff):not(.blk-edge){position:relative;z-index:1}
.blk .wkoff{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none;background-color:color-mix(in srgb,var(--weekend) 78%,transparent);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 10%,transparent) 0 3px,transparent 3px 7px)}
.blk .wkoff.cov{background-color:color-mix(in srgb,var(--surface) 55%,transparent);background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 14%,transparent) 0 2px,transparent 2px 6px)}
/* Leaflet (map) essentials, kept inline */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#dfe3e8;outline-offset:1px;font-size:12px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0;border:0;display:block}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img{max-width:none!important;max-height:none!important}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:0}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}.leaflet-container{cursor:crosshair}
.leaflet-marker-icon.leaflet-interactive{cursor:pointer}.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;width:28px;height:28px;line-height:28px;display:block;text-align:center;text-decoration:none;color:#222;font:bold 18px/28px system-ui,sans-serif}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a.leaflet-disabled{color:#bbb}
.leaflet-control-attribution{background:rgba(255,255,255,.85);padding:0 5px;color:#333;font-size:10px;line-height:1.5}.leaflet-control-attribution a{color:#0b5cad}
.leaflet-control-attribution svg{display:none!important}
.leaflet-div-icon,.afa-pin{background:transparent;border:none}
.leaflet-tooltip{position:absolute;padding:1px 6px;background:#fff;border-radius:4px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35);font-size:11px;font-weight:600;color:#1b1b1b;pointer-events:none}
.leaflet-tooltip-top{transform:translateX(-50%)}.leaflet-tooltip:before{display:none}
.blk.dragging{cursor:grabbing;z-index:6;transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.22),0 0 0 2px var(--accent);transition:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.droprow{box-shadow:inset 0 0 0 2px var(--accent)}
.grip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:26px;color:var(--faint);cursor:grab;touch-action:none;border-radius:4px;flex-shrink:0}
.grip:hover{color:var(--ink);background:var(--sunken)}
.reo-line{position:absolute;left:0;right:0;height:3px;background:var(--accent);z-index:25;pointer-events:none;border-radius:2px}
.blk:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.12);z-index:3}
.blk .t{overflow:hidden;text-overflow:ellipsis}
.blk-pending{opacity:.72;outline:2px dashed currentColor;outline-offset:-2px;cursor:pointer!important}
.blk-edge{position:absolute;top:0;bottom:0;width:9px;z-index:3;cursor:ew-resize;touch-action:none}
.blk-edge-l{left:-2px}.blk-edge-r{right:-2px}
.blk-edge::after{content:"";position:absolute;top:22%;bottom:22%;width:3px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .12s}
.blk-edge-l::after{left:3px}.blk-edge-r::after{right:3px}
.blk:hover .blk-edge::after,.blk.dragging .blk-edge::after{opacity:.45}
@media (pointer:coarse){.blk-edge{width:14px}}
.flag{position:absolute;height:16px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;border-radius:4px;white-space:nowrap;overflow:hidden;pointer-events:auto;font-family:var(--f-mono)}
.dayarea{touch-action:pan-x pan-y;cursor:crosshair}
.scrollbox{overflow:auto;overscroll-behavior:contain}
.scrollbox::-webkit-scrollbar{height:10px;width:10px}
.scrollbox::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--surface)}
.backdrop{background:rgba(10,12,16,.45)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:pop .16s ease-out}
</style>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{colors:{
  bg:'var(--bg)',surface:'var(--surface)',sunken:'var(--sunken)',line:'var(--line)',
  ink:'var(--ink)',muted:'var(--muted)',faint:'var(--faint)',accent:'var(--accent)',
  'accent-soft':'var(--accent-soft)',weekend:'var(--weekend)'}}}};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
</head>
<body>
<div id="root"></div>
<script src="/app.js?v=202610310829"></script>
<script>/* installable app: the service worker (sw.js) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
